<style>
:root{--g:#1f3d2b;--g2:#2f5a40;--fire:#e0441b;--blue:#2b7bd6;--bg:#f4f2ec;--card:#fff;--ink:#1d1d1b;--mut:#6b6a64;--line:#dcd8cc}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:1001;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;gap:8px;align-items:center}
header h1{font-size:15px;margin:0;white-space:nowrap;font-weight:700}
header select{flex:1;font-size:15px;padding:8px;border-radius:8px;border:0;background:#fff;color:var(--ink);height:40px}
header button{height:40px;border:0;border-radius:8px;background:var(--fire);color:#fff;font-weight:700;padding:0 12px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:1001;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--mut);font-weight:600;min-height:54px}
nav button b{display:block;font-size:18px;line-height:1.1}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
main{position:fixed;top:calc(env(safe-area-inset-top) + 56px);bottom:calc(env(safe-area-inset-bottom) + 55px);left:0;right:0;overflow:auto}
.view{display:none;padding:12px;max-width:900px;margin:0 auto}.view.on{display:block}
#v-mapa{padding:0;max-width:none;height:100%}#v-mapa.on{display:block}
#map{position:absolute;inset:0}
.mapbar{position:absolute;z-index:1000;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.mapbar input{width:76px;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:16px}
.mapbar button,.btn{height:42px;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:600;padding:0 12px;font-size:15px;cursor:pointer}
.btn.sec{background:#fff;color:var(--g);border:1.5px solid var(--g)}.btn.fire{background:var(--fire)}.btn.big{height:50px;font-size:17px;width:100%}
.chip{position:absolute;z-index:1000;bottom:12px;left:10px;right:10px;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:14px}
.chip b{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 10px;color:var(--g)}
details.card>summary{font-weight:700;color:var(--g);font-size:16px;cursor:pointer;list-style:none}
details.card>summary::after{content:' ▾'}details.card[open]>summary{margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
label.f input,label.f select,label.f textarea,td input,td select{font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:70px;font-family:inherit}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 10px}.opts label{display:flex;align-items:center;gap:6px;font-size:15px;min-height:32px}
.opts input{width:20px;height:20px;accent-color:var(--g)}
.lbl{font-size:13px;color:var(--mut);margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:4px;border-bottom:1px solid var(--line);text-align:right}th{font-size:12px;color:var(--mut);font-weight:600}
td:first-child,th:first-child{text-align:left}td input{padding:6px;text-align:right;min-width:52px}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.kpi{background:var(--bg);border-radius:10px;padding:8px 10px}.kpi span{display:block;font-size:12px;color:var(--mut)}.kpi b{font-size:20px}
.kpi.main{background:var(--g);color:#fff}.kpi.main span{color:#cfe1d4}
.warn{color:#b3261e;font-size:14px;margin:4px 0}.ok{color:var(--g2);font-size:14px}
.plist .row{display:grid;grid-template-columns:1fr 90px 70px 34px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.plist .row input{font-size:16px;padding:6px;border:1px solid var(--line);border-radius:6px;width:100%}
.plist .row button{border:0;background:none;color:#b3261e;font-size:22px}
.small{font-size:13px;color:var(--mut)}
canvas#croq{width:100%;border-radius:8px;background:#ddd;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}.modal .box{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);background:#222;color:#fff;padding:10px 14px;border-radius:10px;z-index:3000;font-size:14px;display:none;max-width:90vw}
.leaflet-container{font:inherit}
.legend{position:absolute;z-index:1000;right:10px;top:62px;background:rgba(255,255,255,.92);border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.6}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid;margin-right:5px;vertical-align:-2px}
.cbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.cbtns .btn{height:40px;padding:0 10px;font-size:14px}
.seg{display:flex;margin:8px 0;border:1.5px solid var(--g);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;background:#fff;color:var(--g);padding:6px 4px;font-size:13px;font-weight:600;min-height:40px}.seg button.on{background:var(--g);color:#fff}
.btn:disabled{opacity:.4}
</style>

<body>
<header><h1>Aprov. incendio</h1><select id="selSol" aria-label="Solicitud"></select><button id="bNueva" title="Nueva solicitud">+ Nueva</button></header>
<main>
 <section class="view on" id="v-mapa">
  <div id="map"></div>
  <div class="mapbar"><input id="qPol" inputmode="numeric" placeholder="Políg."><input id="qPar" inputmode="numeric" placeholder="Parcela"><button id="bBuscar">Buscar</button><button id="bCapa" class="btn sec" style="background:#fff">Mapa</button><button id="bGps" class="btn sec" style="background:#fff">◎</button><button id="bOff" class="btn sec" style="background:#fff" title="Descargar ortofoto para usar sin conexión" aria-label="Descargar ortofoto para usar sin conexión">⤓ Foto</button></div>
  <div class="legend"><div><i style="border-color:#ffb000"></i>Quemado</div><div><i style="border-color:#ff2a00;background:rgba(255,42,0,.35)"></i>Esta solicitud</div><div><i style="border-color:#3aa0ff;background:rgba(58,160,255,.25)"></i>Otras</div><div><i style="border-color:#fff;border-style:dashed;background:rgba(85,85,85,.6)"></i>Excluido</div></div>

<div class="modal" id="modal"><div class="box"><div id="mTxt"></div><div class="acts"><button class="btn sec" id="mNo">Cancelar</button><button class="btn" id="mSi">Aceptar</button></div></div></div>
<div class="modal" id="offl"><div class="box"><h2 style="margin:0 0 6px;font-size:18px;color:var(--g)">Ortofoto sin conexión</h2>
<div class="small">Descarga ahora, con cobertura, la ortofoto PNOA de la zona. Después se verá en el mapa y servirá para el croquis aunque no haya conexión.</div>
<div class="lbl">Zona</div><div class="opts" id="offZona"><label><input type="radio" name="oz" value="sol" checked>Parcelas de esta solicitud</label><label><input type="radio" name="oz" value="vista">Vista actual del mapa</label><label><input type="radio" name="oz" value="todo">Todo el incendio</label></div>
<label class="f">Detalle máximo<select id="offZ"><option value="17">Medio (zoom 17, ~1 m)</option><option value="18" selected>Alto (zoom 18, ~0,5 m) · recomendado</option><option value="19">Máximo (zoom 19, ~0,25 m)</option></select></label>
<p id="offEst" style="margin:10px 0 4px;font-weight:600"></p><div style="height:10px;background:#e8e4d8;border-radius:5px;overflow:hidden"><div id="offBar" style="height:100%;width:0;background:var(--g);transition:width .2s"></div></div>
<p class="small" id="offInfo" style="margin:6px 0 0"></p>
<div class="acts" style="flex-wrap:wrap"><button class="btn sec" id="offDel" style="color:#b3261e;border-color:#b3261e;margin-right:auto">Borrar descargas</button><button class="btn sec" id="offClose">Cerrar</button><button class="btn" id="offGo">Descargar</button></div></div></div>
<div id="toast"></div>
<input type="file" id="fImport" accept=".json,application/json" hidden>
<input type="file" id="fKml" accept=".kml" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>var NOMAP=!window.L;if(NOMAP){(function(){var me=function(){return o;},o;o={addTo:me,on:me,setView:me,fitBounds:me,invalidateSize:me,removeLayer:me,setStyle:me,setLatLng:me,extend:me,hasLayer:function(){return true;},isValid:function(){return false;},clearLayers:function(){return o;},getBounds:function(){return o;}};
window.L={map:me,tileLayer:me,polygon:me,canvas:me,latLngBounds:me,circleMarker:me,layerGroup:me,control:{zoom:me}};})();}</script>
<script>var DATA=null,TPL=null;</script>
<script src="js/core.js"></script>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=[];
// ---------- estado ----------
let sols=[],cur=0;
function load(){try{const s=JSON.parse(localStorage.getItem('af_sols')||'null');if(s&&s.length){sols=s;cur=+localStorage.getItem('af_cur')||0;}}catch(e){}
 if(!sols.length)sols=[nuevaSol()];if(cur>=sols.length)cur=0;}
function save(){try{localStorage.setItem('af_sols',JSON.stringify(sols));localStorage.setItem('af_cur',cur);}catch(e){}}
function nuevaSol(){return {id:Date.now(),f:{prov:'Toledo',fecha:new Date().toISOString().slice(0,10)},cb:{},parcels:[],sp:[nuevaEspecie(),nuevaEspecie()],g:{}};}
const S=()=>sols[cur];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600);}
function ask(html,ok){$('#mTxt').innerHTML=html;$('#modal').classList.add('on');$('#mSi').onclick=()=>{$('#modal').classList.remove('on');ok();};$('#mNo').onclick=()=>$('#modal').classList.remove('on');}
function nombreSol(s,i){return (s.f.exp?s.f.exp:'Solicitud '+(i+1))+(s.f.ap1||s.f.razon?' · '+(s.f.razon||((s.f.nombre||'')+' '+s.f.ap1)):'')+' ('+s.parcels.length+')';}
function renderSel(){$('#selSol').innerHTML=sols.map((s,i)=>`<option value="${i}" ${i===cur?'selected':''}>${esc(nombreSol(s,i))}</option>`).join('');}
$('#selSol').onchange=e=>{cur=+e.target.value;save();renderAll();};
$('#bNueva').onclick=()=>{sols.push(nuevaSol());cur=sols.length-1;save();renderAll();toast('Nueva solicitud creada. Selecciona sus parcelas en el mapa.');};
// ---------- navegación ----------
$$('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){if(!sols.length)return;$$('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
 if(v==='mapa')setTimeout(()=>map.invalidateSize(),50);if(v==='madera')renderMadera();if(v==='informe')renderInforme();if(v==='datos')renderDatos();}
// ---------- mapa ----------
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([39.6,-4.9],12);
L.control.zoom({position:'bottomleft'}).addTo(map);
const wmts=(svc,layer,fmt)=>`https://www.ign.es/wmts/${svc}?service=WMTS&request=GetTile&version=1.0.0&Format=image/${fmt}&layer=${layer}&style=default&tilematrixset=GoogleMapsCompatible&TileMatrix={z}&TileRow={y}&TileCol={x}`;
const orto=L.tileLayer(wmts('pnoa-ma','OI.OrthoimageCoverage','jpeg'),{maxZoom:20,maxNativeZoom:19,attribution:'PNOA © IGN-CNIG'}).addTo(map);
const base=L.tileLayer(wmts('ign-base','IGNBaseTodo','png'),{maxZoom:20,maxNativeZoom:17,attribution:'Mapa base © IGN-CNIG'});
$('#bCapa').onclick=()=>{if(map.hasLayer(orto)){map.removeLayer(orto);base.addTo(map);$('#bCapa').textContent='Orto';}else{map.removeLayer(base);orto.addTo(map);$('#bCapa').textContent='Mapa';}};
let gpsM=null;$('#bGps').onclick=()=>{if(!navigator.geolocation)return toast('Ubicación no disponible');navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(gpsM)gpsM.setLatLng(ll);else gpsM=L.circleMarker(ll,{radius:8,color:'#fff',fillColor:'#2b7bd6',fillOpacity:1,weight:3}).addTo(map);map.setView(ll,16);},()=>toast('No se pudo obtener la ubicación'),{enableHighAccuracy:true,timeout:10000});};
const rend=L.canvas({tolerance:6});let layers=[];
function decode(polys){return polys.map(rings=>rings.map(f=>{const out=[];let x=f[0],y=f[1];out.push([y/1e6,x/1e6]);for(let i=2;i<f.length;i+=2){x+=f[i];y+=f[i+1];out.push([y/1e6,x/1e6]);}return out;}));}
function owner(i){if(S().parcels.some(p=>p.i===i))return cur;for(let k=0;k<sols.length;k++)if(k!==cur&&sols[k].parcels.some(p=>p.i===i))return k;return -1;}
function styleFor(i){const o=owner(i);if(o===cur)return {color:'#ff2a00',weight:2.5,fillColor:'#ff2a00',fillOpacity:.35};if(o>=0)return {color:'#3aa0ff',weight:1.5,fillColor:'#3aa0ff',fillOpacity:.25};return {color:'#ffb000',weight:1,fillColor:'#ffb000',fillOpacity:.06};}
function buildLayers(){layers.forEach(l=>l&&map.removeLayer(l));layers=P.map((q,i)=>{const lyr=L.polygon(decode(q[6]),Object.assign({renderer:rend},styleFor(i)));lyr.on('click',()=>tapParcel(i));lyr.addTo(map);return lyr;});
 const b=L.latLngBounds([]);layers.forEach(l=>b.extend(l.getBounds()));if(b.isValid())map.fitBounds(b);}
const cutLayer=L.layerGroup().addTo(map);
function drawCuts(){cutLayer.clearLayers();sols.forEach(s=>s.parcels.forEach(p=>(p.cuts||[]).forEach(c=>{const ll=c.r.map(([lo,la])=>[la,lo]);
 L.polygon(ll,c.t==='ex'?{renderer:rend,interactive:false,color:'#fff',weight:1.5,dashArray:'5 4',fillColor:'#555',fillOpacity:.6}:{renderer:rend,interactive:false,color:'#7CFC00',weight:2.5,dashArray:'5 4',fill:false}).addTo(cutLayer);})));}
function restyle(){layers.forEach((l,i)=>l.setStyle(styleFor(i)));drawCuts();}
const ha=i=>P[i][3]/10000;
const pName=i=>'Pol. '+parseInt(P[i][0],10)+' · Parc. '+parseInt(P[i][1],10)+(P[i][2]==='X'?' (dominio público)':'');
const fmtHa=h=>h.toFixed(2).replace('.',',');
function tapParcel(i){if(drawing)return;const o=owner(i),s=S();
 if(o===cur){chipIn(i);return;}
 if(o>=0){chipMove(i,o);return;}
 s.parcels.push({i,sup:fmtHa(ha(i)),rec:'',obs:''});save();restyle();renderSel();chipIn(i,'Añadida a la solicitud.');}
function chipIn(i,msg){const p=S().parcels.find(q=>q.i===i);if(!p)return;const t=supTotal(S());const rc=p.cuts&&p.cuts.length;
 $('#chip').innerHTML=`<b>${esc(pName(i))}</b> · ${rc?`<s>${fmt(ha(i),2)}</s> → <b>${esc(p.sup)} ha</b> (recortada)`:fmt(ha(i),2)+' ha quemadas'}<br>${msg?esc(msg)+' ':''}Solicitud: ${S().parcels.length} parcelas, ${fmt(t,2)} ha.
 <div class="cbtns"><button class="btn" id="bRec">✂ Recortar</button>${rc?'<button class="btn sec" id="bUndoRec">Quitar recortes</button>':''}<button class="btn sec" id="bQuitar" style="color:#b3261e;border-color:#b3261e">Quitar de la solicitud</button></div>`;
 $('#bRec').onclick=()=>startCut(i);
 if(rc)$('#bUndoRec').onclick=()=>{p.cuts=[];p.sup=fmtHa(ha(i));delete p.excl;delete p.ux;delete p.uy;save();restyle();renderSel();chipIn(i,'Recortes eliminados.');};
 $('#bQuitar').onclick=()=>{S().parcels=S().parcels.filter(q=>q.i!==i);save();restyle();renderSel();$('#chip').innerHTML=`<b>${esc(pName(i))}</b> quitada de la solicitud.`;};}
// ----- recorte de geometrías -----
let drawing=null;
function startCut(i){map.fitBounds(layers[i].getBounds(),{maxZoom:18,padding:[20,20]});drawing={i,t:'ex',pts:[],g:L.layerGroup().addTo(map)};renderDraw();}
function renderDraw(){const d=drawing;d.g.clearLayers();const ex=d.t==='ex';
 if(d.pts.length>1)L.polygon(d.pts,{renderer:rend,interactive:false,color:ex?'#fff':'#7CFC00',weight:2.5,dashArray:'6 4',fillColor:ex?'#555':'#7CFC00',fillOpacity:.35}).addTo(d.g);
 d.pts.forEach(p=>L.circleMarker(p,{renderer:rend,interactive:false,radius:6,color:'#fff',weight:2,fillColor:'#e0441b',fillOpacity:1}).addTo(d.g));
 $('#chip').innerHTML=`<b>Recortar ${esc(pName(d.i))}</b><div class="seg"><button data-t="ex" class="${ex?'on':''}">Excluir zona (pastos…)</button><button data-t="in" class="${ex?'':'on'}">Conservar solo zona</button></div>
 <div class="small">${ex?'Toca el mapa para dibujar el contorno de la zona que <b>no</b> se aprovecha.':'Toca el mapa para dibujar el contorno del pinar que <b>sí</b> se aprovecha.'} Puntos: ${d.pts.length}</div>
 <div class="cbtns"><button class="btn sec" id="dUndo" ${d.pts.length?'':'disabled'}>↶ Punto</button><button class="btn sec" id="dGps">◎ Mi posición</button><button class="btn sec" id="dCancel">Cancelar</button><button class="btn fire" id="dOk" ${d.pts.length>2?'':'disabled'}>Aplicar</button></div>`;
 $$('#chip .seg button').forEach(b=>b.onclick=()=>{d.t=b.dataset.t;renderDraw();});
 $('#dUndo').onclick=()=>{d.pts.pop();renderDraw();};
 $('#dCancel').onclick=()=>{map.removeLayer(d.g);drawing=null;chipIn(d.i);};
 $('#dGps').onclick=()=>{if(!navigator.geolocation)return toast('Ubicación no disponible');toast('Obteniendo posición…');navigator.geolocation.getCurrentPosition(p=>{if(!drawing)return;drawing.pts.push([p.coords.latitude,p.coords.longitude]);renderDraw();},()=>toast('No se pudo obtener la ubicación'),{enableHighAccuracy:true,timeout:15000,maximumAge:0});};
 $('#dOk').onclick=applyCut;}
map.on('click',e=>{if(drawing){drawing.pts.push([e.latlng.lat,e.latlng.lng]);renderDraw();}});
function applyCut(){const d=drawing,p=S().parcels.find(q=>q.i===d.i);if(!p)return;
 const prev=(p.cuts||[]).slice();p.cuts=prev.concat([{t:d.t,r:d.pts.map(([la,lo])=>[+lo.toFixed(7),+la.toFixed(7)])}]);
 const before=prev.length?cutStats(Object.assign({},p,{cuts:prev})).a:P[d.i][3];const st=cutStats(p);
 if(st.a<1){p.cuts=prev;toast('Con ese dibujo no queda superficie: revísalo');return;}
 if(Math.abs(st.a-before)<1){p.cuts=prev;toast('La zona dibujada no corta la parcela');return;}
 p.sup=fmtHa(st.a/1e4);p.excl=(P[d.i][3]-st.a)/1e4;p.ux=Math.round(st.x);p.uy=Math.round(st.y);
 map.removeLayer(d.g);drawing=null;save();restyle();renderSel();chipIn(d.i,'Recorte aplicado: se excluyen '+fmt(p.excl,2)+' ha.');}
const utmCache={};
function utmRings(i){if(!utmCache[i])utmCache[i]=decode(P[i][6]).flat().map(r=>r.map(([la,lo])=>toUtm(lo,la)));return utmCache[i];}
function pipR(r,x,y){let c=false;for(let a=0,b=r.length-1;a<r.length;b=a++){const xa=r[a][0],ya=r[a][1],xb=r[b][0],yb=r[b][1];if((ya>y)!==(yb>y)&&x<(xb-xa)*(y-ya)/(yb-ya)+xa)c=!c;}return c;}
function pipAll(rs,x,y){let c=false;for(const r of rs)if(pipR(r,x,y))c=!c;return c;}
function bbx(rs){const a=[1e99,1e99,-1e99,-1e99];rs.forEach(r=>r.forEach(([x,y])=>{if(x<a[0])a[0]=x;if(y<a[1])a[1]=y;if(x>a[2])a[2]=x;if(y>a[3])a[3]=y;}));return a;}
function cutStats(p){const R=utmRings(p.i),A0=P[p.i][3]||0;const cs=p.cuts||[];
 const conv=c=>c.r.map(([lo,la])=>toUtm(lo,la));const ex=cs.filter(c=>c.t==='ex').map(conv),inn=cs.filter(c=>c.t!=='ex').map(conv);
 if(!cs.length)return {a:A0,x:P[p.i][4],y:P[p.i][5]};
 const bP=bbx(R);let b=bbx(inn.length?inn:ex);b=[Math.max(b[0],bP[0]),Math.max(b[1],bP[1]),Math.min(b[2],bP[2]),Math.min(b[3],bP[3])];
 let a=inn.length?0:A0;
 if(b[2]>b[0]&&b[3]>b[1]){const st=Math.max(0.25,Math.sqrt((b[2]-b[0])*(b[3]-b[1])/300000));let n=0;
  for(let y=b[1]+st/2;y<b[3];y+=st)for(let x=b[0]+st/2;x<b[2];x+=st){if(!pipAll(R,x,y))continue;const inE=ex.some(r=>pipR(r,x,y));
   if(inn.length){if(!inE&&inn.some(r=>pipR(r,x,y)))n++;}else if(inE)n++;}
  a=inn.length?n*st*st:A0-n*st*st;}
 const st2=Math.max(0.5,Math.sqrt((bP[2]-bP[0])*(bP[3]-bP[1])/20000));let sx=0,sy=0,k=0;
 for(let y=bP[1]+st2/2;y<bP[3];y+=st2)for(let x=bP[0]+st2/2;x<bP[2];x+=st2){if(pipAll(R,x,y)&&(!inn.length||inn.some(r=>pipR(r,x,y)))&&!ex.some(r=>pipR(r,x,y))){sx+=x;sy+=y;k++;}}
 return {a:Math.max(0,a),x:k?sx/k:P[p.i][4],y:k?sy/k:P[p.i][5]};}

function parseKml(t){const out=[];const pms=t.split('<Placemark').slice(1);for(const p of pms){const g=n=>{const m=p.match(new RegExp('name="'+n+'">([^<]*)<'));return m?m[1]:'';};
 const polys=[];for(const poly of p.split('<Polygon>').slice(1)){const rings=[];const re=/<coordinates>([\s\S]*?)<\/coordinates>/g;let m;const body=poly.split('</Polygon>')[0];while((m=re.exec(body))){const pts=m[1].trim().split(/\s+/).map(c=>c.split(',').map(Number));const fl=[Math.round(pts[0][0]*1e6),Math.round(pts[0][1]*1e6)];for(let i=1;i<pts.length;i++){fl.push(Math.round(pts[i][0]*1e6)-Math.round(pts[i-1][0]*1e6),Math.round(pts[i][1]*1e6)-Math.round(pts[i-1][1]*1e6));}rings.push(fl);}if(rings.length)polys.push(rings);}
 if(!polys.length)continue;let area=parseFloat(g('AREA'));if(!(area>0))area=(parseFloat(g('Shape_Area'))||0)*1e4;
 let X=parseFloat(g('COORX'))||0,Y=parseFloat(g('COORY'))||0;if(!X){let best=null;polys.forEach(rs=>{const c=ringCentroid(rs[0]);if(!best||c[2]>best[2])best=c;});const u=toUtm(best[0],best[1]);X=u[0];Y=u[1];}
